#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-MILESTONE-ONE"
title = "First milestone acceptance"
kind = "normative"
status = "active"

[content]
text = "The first milestone MUST run two synchronized inference pods on one GPU node, account for each pod's RDMA access through a bounded operator-provided resource request, record its declared isolation scope and trust domain, and enforce host admission and default-deny pod networking. Evidence MUST prove KV traffic traverses the intended RDMA backend and device rather than pod networking, shared memory, CUDA IPC, TCP, or another fallback. TTL teardown MUST remove all Oubliette-owned host artifacts without agent cleanup."
