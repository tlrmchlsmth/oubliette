#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-AGENT-RUNTIME"
title = "Consumer-owned agent sandbox"
kind = "normative"
status = "active"

[content]
text = "Every model-driven agent process MUST execute inside an approved sandbox owned by its consumer. Oubliette MUST NOT depend on one sandbox implementation, and host safety MUST remain valid if the consumer sandbox is compromised. OpenShell is the first-class resident and bootstrap integration; consumers such as Crucible MAY provide their own sandbox. Neither resident nor external agents may receive host Kubernetes credentials."
