#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-AGENT-RUNTIME"
title = "OpenShell agent execution modes"
kind = "normative"
status = "active"

[content]
text = "Every model-driven agent process MUST execute inside an OpenShell sandbox. In normal operation, the OpenShell agent SHOULD run inside the Oubliette it administers. During Oubliette bootstrap and development, an OpenShell-sandboxed developer agent MAY run outside the target Oubliette and use that Oubliette as its disposable development and test cluster. Neither mode may grant the agent host Kubernetes credentials."
