#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-NETWORK-ISOLATION"
title = "Clique network isolation"
kind = "normative"
status = "active"

[content]
text = "Host pod networking MUST default deny traffic outside the clique, permit required intra-clique traffic, and restrict egress to an operator allowlist. RDMA access MUST come from an operator-owned profile that declares its enforced isolation scope and trust domain. Mutually untrusted cliques MUST NOT share an RDMA trust domain; they require per-clique isolation, exclusive placement, or a stricter operator boundary. Transport evidence MUST NOT be presented as proof of a stronger fabric isolation scope."
