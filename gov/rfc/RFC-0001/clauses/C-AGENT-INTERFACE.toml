#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-AGENT-INTERFACE"
title = "Agent lifecycle interface"
kind = "normative"
status = "active"

[content]
text = "An agent has three distinct Oubliette surfaces: an authenticated lifecycle MCP interface; its private virtual Kubernetes API; and, when enabled by profile, a private read-only Prometheus-compatible metrics API scoped to that Oubliette. Initial lifecycle operations MUST be create, get, list, renew, and delete. After readiness, agents MUST use the virtual Kubernetes API directly for in-Oubliette operations and the scoped metrics API directly for metrics queries. The lifecycle MCP interface MUST NOT proxy either data-plane API or the host Kubernetes or Prometheus APIs, expose host credentials or raw host policy controls, or return data-plane credentials in tool results. Consumer integrations MUST deliver private data-plane endpoints and credentials outside model transcripts."
