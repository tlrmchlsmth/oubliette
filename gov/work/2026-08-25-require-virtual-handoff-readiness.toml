[content]
description = "Implement the [[ADR-0007]] readiness contract by provisioning the virtual handoff ServiceAccount and cluster-admin binding through the in-memory bootstrap kubeconfig, verifying both resources before Ready=True, and keeping bootstrap credentials out of status, logs, and lifecycle results."

[[content.acceptance_criteria]]
text = "The controller uses the chart-generated bootstrap kubeconfig only in memory to create a fixed virtual ServiceAccount and cluster-admin binding, without exposing bootstrap material in status, logs, or MCP results."
status = "done"
category = "security"

[[content.acceptance_criteria]]
text = "Handoff resource creation is declarative and idempotent, repairs drift, and retries while the virtual API is unavailable."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "Ready remains false until the virtual API, bootstrap credential, handoff ServiceAccount, and exact cluster-admin binding are all present."
status = "done"
category = "security"

[[content.acceptance_criteria]]
text = "Automated tests cover missing and malformed bootstrap configuration, missing or incorrect handoff resources, successful provisioning, readiness, and repair."
status = "done"
category = "security"

[[content.acceptance_criteria]]
text = "Go tests, static validation, govctl check, and the required governance guard pass."
status = "done"
category = "chore"
