#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0007"
title = "Define virtual-cluster credential issuance and consumer handoff"
status = "proposed"
date = "2026-08-25"
refs = ["RFC-0001"]

[content]
context = "Resident and external agents need cluster-admin authority in a virtual cluster without receiving any credential useful against the host. Credentials must become available only after host policy is ready, expire or disappear with the clique, and be delivered through OpenShell, Crucible, or another approved consumer sandbox without entering MCP transcripts."
decision = """
Describe the decision that was made.
What is the change that we're proposing and/or doing?"""
consequences = "The choice affects revocation, rotation, ServiceAccount scope, Secret exposure, consumer adapter responsibilities, CLI behavior, and the ordering of Ready status."

[[content.alternatives]]
text = "Use placement-specific access: an in-cluster ServiceAccount for resident agents and short-lived injected credentials for external agents"
status = "considered"

[[content.alternatives]]
text = "Mint the same short-lived kubeconfig for every consumer and placement"
status = "considered"

[[content.alternatives]]
text = "Use the long-lived administrative kubeconfig generated by vCluster"
status = "considered"

[[content.alternatives]]
text = "Require an exec-credential plugin backed by an Oubliette token broker for every placement"
status = "considered"
