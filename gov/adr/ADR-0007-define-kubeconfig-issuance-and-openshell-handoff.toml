#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0007"
title = "Define virtual-cluster credential issuance and consumer handoff"
status = "accepted"
date = "2026-08-25"
refs = ["RFC-0001"]

[content]
context = "Resident and external agents need cluster-admin authority in a virtual cluster without receiving any credential useful against the host. Credentials must become available only after host policy is ready, expire or disappear with the clique, and be delivered through OpenShell, Crucible, or another approved consumer sandbox without entering MCP transcripts. Decision criteria: zero host credential exposure, short and enforceable credential lifetime, revocation and rotation, support for resident and external agents, transcript exclusion, consumer integration complexity, and recovery access."
decision = "Use placement-specific virtual-cluster access. Resident agents receive a projected token for an in-virtual-cluster ServiceAccount. External consumer adapters use a trusted bootstrap credential to request a short-lived virtual ServiceAccount token, construct a kubeconfig containing only the private virtual endpoint, inject it into the consumer sandbox outside the model transcript, and discard the bootstrap material. Mark an Oubliette Ready only after host controls, the virtual API, and the handoff ServiceAccount are ready. Never expose the chart-generated administrative kubeconfig through MCP or directly to an agent."
consequences = "Credentials authenticate only to the virtual API and can be short-lived, rotated, and removed with the Oubliette. Consumer adapters own private endpoint connectivity and secure injection. Oubliette must maintain a trusted bootstrap path for token issuance and test that neither bootstrap credentials nor kubeconfig contents enter MCP results, logs, or agent-visible host objects."

[[content.alternatives]]
text = "Use placement-specific access: an in-cluster ServiceAccount for resident agents and short-lived injected credentials for external agents"
status = "accepted"

[[content.alternatives]]
text = "Mint the same short-lived kubeconfig for every consumer and placement"
status = "rejected"

[[content.alternatives]]
text = "Use the long-lived administrative kubeconfig generated by vCluster"
status = "rejected"

[[content.alternatives]]
text = "Require an exec-credential plugin backed by an Oubliette token broker for every placement"
status = "rejected"
