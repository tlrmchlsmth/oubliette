#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0007"
title = "Define kubeconfig issuance and OpenShell handoff"
status = "proposed"
date = "2026-08-25"
refs = ["RFC-0001"]

[content]
context = "The agent needs cluster-admin authority in its virtual cluster without receiving any credential useful against the host. Credentials must become available only after host policy is ready and must expire or disappear with the clique."
decision = """
Describe the decision that was made.
What is the change that we're proposing and/or doing?"""
consequences = "The choice affects revocation, rotation, Secret exposure, OpenShell integration, CLI behavior, and the ordering of Ready status."

[[content.alternatives]]
text = "Mint a short-lived virtual kubeconfig and hand it into the OpenShell sandbox through a bounded secret channel"
status = "considered"

[[content.alternatives]]
text = "Use the long-lived administrative kubeconfig generated by vCluster"
status = "considered"

[[content.alternatives]]
text = "Use an exec-credential plugin backed by an Oubliette token broker"
status = "considered"
