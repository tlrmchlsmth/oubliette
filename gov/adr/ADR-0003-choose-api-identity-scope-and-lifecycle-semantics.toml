#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0003"
title = "Choose API identity scope and lifecycle semantics"
status = "accepted"
date = "2026-08-25"
refs = ["RFC-0001"]

[content]
context = "The public Kubernetes API identity, CR scope, derived namespace naming, TTL behavior, and terminal observability are difficult to migrate after users create objects. In particular, deleted Kubernetes objects cannot retain a terminal status condition."
decision = "Use a cluster-scoped `Oubliette` custom resource in API group `oubliette.tlrmchlsmth.github.io`, initially at version `v1alpha1`, with short name `oub`. The controller derives a host namespace named `oub-<id>`; callers cannot choose or share that namespace. Every object has an absolute UTC expiry in `spec.expiresAt`. The lifecycle service converts relative TTL requests into a policy-bounded expiry, and renewal may only move a non-terminal object's expiry forward within policy. The controller begins finalization when the expiry is reached, even if provisioning never became ready. TTL expiry removes all owned infrastructure and credentials, then retains the root resource as a bounded tombstone with `Forgotten=True` so expiry is observable. Explicit Kubernetes deletion uses a finalizer to perform the same cleanup and then removes the root resource; clients observe that path through the lifecycle operation and audit trail rather than a post-deletion condition. Tombstone retention is operator-configured and finite."
consequences = "The stable API identity and cluster scope match Oubliette's host-wide resource ownership, while derived namespaces prevent callers from weakening tenancy. Absolute expiry is restart-safe and unambiguous, and retained TTL tombstones make automatic forgetting observable. The controller must authorize lifecycle callers above the CRD, enforce monotonic bounded renewal, garbage-collect tombstones, and test both expiry and explicit-deletion finalization. A future API version is required for incompatible changes."

[[content.alternatives]]
text = "Use a cluster-scoped Oubliette CR under a GitHub-backed DNS group with controller-retained TTL tombstones"
status = "accepted"

[[content.alternatives]]
text = "Use a namespaced Oubliette CR in an operator control namespace"
status = "rejected"

[[content.alternatives]]
text = "Expose only the underlying vCluster release API and keep no Oubliette CR"
status = "rejected"
