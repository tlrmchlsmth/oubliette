[paths]
docs_output = "docs"

[project]
default_owner = "@tlrmchlsmth"
name = "oubliette"

[schema]
version = 5

[source_scan]
enabled = true
include = [
    "**/*.md",
    "**/*.go",
    "**/*.yaml",
    "**/*.yml",
]

[tags]
allowed = [
    "api",
    "governance",
    "lifecycle",
    "networking",
    "observability",
    "scheduling",
    "security",
    "vcluster",
    "kueue",
]

[verification]
default_guards = ["GUARD-GOVCTL-REPOSITORY-VALIDATION"]
enabled = true
