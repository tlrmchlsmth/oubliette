apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oubliettes.oubliette.tlrmchlsmth.github.io
spec:
  group: oubliette.tlrmchlsmth.github.io
  scope: Cluster
  names:
    plural: oubliettes
    singular: oubliette
    kind: Oubliette
    listKind: OublietteList
    shortNames: [oub]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Expires
          type: date
          jsonPath: .spec.expiresAt
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Forgotten
          type: string
          jsonPath: .status.conditions[?(@.type=='Forgotten')].status
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [tier, expiresAt]
              properties:
                tier:
                  type: string
                  enum: [stub, gpu]
                expiresAt:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                hostNamespace:
                  type: string
                profileGeneration:
                  type: string
                virtualEndpoint:
                  type: string
                forgottenAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
