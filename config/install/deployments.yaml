apiVersion: apps/v1
kind: Deployment
metadata:
  name: oubliette-controller
  namespace: oubliette-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: oubliette-controller}
  template:
    metadata:
      labels: {app: oubliette-controller}
    spec:
      serviceAccountName: oubliette-controller
      securityContext:
        fsGroup: 65532
      containers:
        - name: controller
          image: image-registry.openshift-image-registry.svc:5000/oubliette-system/oubliette:demo
          imagePullPolicy: Always
          args:
            - --vcluster-chart=/charts/vcluster-0.36.1.tgz
            - --kueue-cluster-queue=$(KUEUE_CLUSTER_QUEUE)
            - --kueue-managed-label=$(KUEUE_MANAGED_LABEL)
            - --kueue-managed-value=$(KUEUE_MANAGED_VALUE)
            - --host-workload-queue=$(HOST_WORKLOAD_QUEUE)
            - --vcluster-run-as-user=$(VCLUSTER_RUN_AS_USER)
            - --vcluster-run-as-group=$(VCLUSTER_RUN_AS_GROUP)
            - --vcluster-fs-group=$(VCLUSTER_FS_GROUP)
            - --vcluster-ephemeral-storage-request=$(VCLUSTER_EPHEMERAL_STORAGE_REQUEST)
            - --vcluster-ephemeral-storage-limit=$(VCLUSTER_EPHEMERAL_STORAGE_LIMIT)
            - --metrics-profile-generation=$(METRICS_PROFILE_GENERATION)
            - --metrics-isolation-scope=$(METRICS_ISOLATION_SCOPE)
            - --metrics-trust-domain=$(METRICS_TRUST_DOMAIN)
            - --evidence-store=/var/lib/oubliette/evidence
          env:
            - {name: KUEUE_CLUSTER_QUEUE, value: ""}
            - {name: KUEUE_MANAGED_LABEL, value: kueue.x-k8s.io/managed-namespace}
            - {name: KUEUE_MANAGED_VALUE, value: "true"}
            - {name: HOST_WORKLOAD_QUEUE, value: ""}
            - {name: VCLUSTER_RUN_AS_USER, value: "1000"}
            - {name: VCLUSTER_RUN_AS_GROUP, value: "1000"}
            - {name: VCLUSTER_FS_GROUP, value: "1000"}
            - {name: VCLUSTER_EPHEMERAL_STORAGE_REQUEST, value: 256Mi}
            - {name: VCLUSTER_EPHEMERAL_STORAGE_LIMIT, value: 4Gi}
            - {name: METRICS_PROFILE_GENERATION, value: ""}
            - {name: METRICS_ISOLATION_SCOPE, value: ""}
            - {name: METRICS_TRUST_DOMAIN, value: ""}
          ports:
            - {name: health, containerPort: 8081}
          volumeMounts:
            - {name: evidence-store, mountPath: /var/lib/oubliette/evidence}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
      volumes:
        - name: evidence-store
          persistentVolumeClaim:
            claimName: oubliette-evidence
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oubliette-evidence
  namespace: oubliette-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oubliette-mcp
  namespace: oubliette-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: oubliette-mcp}
  template:
    metadata:
      labels: {app: oubliette-mcp}
    spec:
      serviceAccountName: oubliette-mcp
      containers:
        - name: mcp
          image: image-registry.openshift-image-registry.svc:5000/oubliette-system/oubliette:demo
          imagePullPolicy: Always
          command: ["/mcp"]
          args: ["--token-audience=oubliette-mcp"]
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
---
apiVersion: v1
kind: Service
metadata:
  name: oubliette-mcp
  namespace: oubliette-system
spec:
  type: ClusterIP
  selector: {app: oubliette-mcp}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oubliette-metrics
  namespace: oubliette-system
spec:
  replicas: 0
  selector:
    matchLabels: {app: oubliette-metrics}
  template:
    metadata:
      labels: {app: oubliette-metrics}
    spec:
      serviceAccountName: oubliette-metrics
      containers:
        - name: metrics-gateway
          image: image-registry.openshift-image-registry.svc:5000/oubliette-system/oubliette:demo
          imagePullPolicy: Always
          command: ["/metrics-gateway"]
          args:
            - --prometheus-url=$(PROMETHEUS_URL)
            - --profile-generation=$(METRICS_PROFILE_GENERATION)
            - --allowed-metrics=$(ALLOWED_METRICS)
          env:
            - {name: PROMETHEUS_URL, value: ""}
            - {name: METRICS_PROFILE_GENERATION, value: ""}
            - {name: ALLOWED_METRICS, value: ""}
          volumeMounts:
            - {name: token-key, mountPath: /var/run/secrets/oubliette-metrics, readOnly: true}
            - {name: issuer-token, mountPath: /var/run/secrets/oubliette-metrics-issuer, readOnly: true}
          ports:
            - {name: http, containerPort: 8082}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
      volumes:
        - name: token-key
          secret:
            secretName: oubliette-metrics-token-key
        - name: issuer-token
          secret:
            secretName: oubliette-metrics-issuer-token
---
apiVersion: v1
kind: Service
metadata:
  name: oubliette-metrics
  namespace: oubliette-system
spec:
  # The authenticated consumer-owned connector requires a provider-private
  # LoadBalancer. Operators should apply their platform's internal-LB
  # annotation in the installation overlay.
  type: LoadBalancer
  selector: {app: oubliette-metrics}
  ports:
    - {name: http, port: 8082, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oubliette-metrics-private
  namespace: oubliette-system
spec:
  podSelector:
    matchLabels: {app: oubliette-metrics}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: oubliette.tlrmchlsmth.github.io/id
                operator: Exists
    - from:
        - namespaceSelector:
            matchLabels:
              oubliette.tlrmchlsmth.github.io/metrics-connector: "true"
    # External consumer-owned connectors arrive through the private
    # LoadBalancer and authenticate at the gateway/issuer HTTP boundary.
    - ports:
        - {protocol: TCP, port: 8082}
